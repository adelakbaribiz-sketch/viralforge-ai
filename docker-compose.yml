# =============================================================================
# ViralForge AI — Local Development Compose
# =============================================================================
# Brings up the full local stack:
#   - PostgreSQL 16 (with RLS-friendly config)
#   - Redis 7 (BullMQ)
#   - MinIO (S3-compatible storage)
#   - Web (Next.js 16)
#   - API (Fastify)
#   - Worker (BullMQ workers + Remotion renderer + FFmpeg)
#   - Caddy (reverse proxy on :80)
#
# Usage:
#   cp .env.example .env
#   docker compose up -d postgres redis minio
#   pnpm --filter @viralforge/db db:migrate
#   pnpm --filter @viralforge/db db:seed
#   docker compose up -d
#
# No no-code automation: nothing here uses Make.com, n8n, Zapier, or any
# no-code automation tool. All orchestration is implemented in this repo.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: viralforge
      POSTGRES_USER: viralforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viralforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-viralforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-viralforge-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run once on first boot to create the S3 bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-viralforge} ${MINIO_ROOT_PASSWORD:-viralforge-secret};
      mc mb --ignore-existing local/vf-assets;
      mc mb --ignore-existing local/vf-output;
      mc mb --ignore-existing local/vf-tmp;
      mc mb --ignore-existing local/vf-music;
      mc mb --ignore-existing local/vf-captions;
      mc anonymous set download local/vf-output;
      exit 0;
      "

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://viralforge:${POSTGRES_PASSWORD:-viralforge}@postgres:5432/viralforge?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: vf-assets
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-viralforge}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-viralforge-secret}
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-prod}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://viralforge:${POSTGRES_PASSWORD:-viralforge}@postgres:5432/viralforge?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-viralforge}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-viralforge-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
      PIKA_API_KEY: ${PIKA_API_KEY:-}
      STORYBLOCKS_API_KEY: ${STORYBLOCKS_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-prod}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://viralforge:${POSTGRES_PASSWORD:-viralforge}@postgres:5432/viralforge?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-viralforge}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-viralforge-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
      PIKA_API_KEY: ${PIKA_API_KEY:-}
      LUMA_API_KEY: ${LUMA_API_KEY:-}
      KLING_API_KEY: ${KLING_API_KEY:-}
      HAILUO_API_KEY: ${HAILUO_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      STORYBLOCKS_API_KEY: ${STORYBLOCKS_API_KEY:-}
      NODE_ENV: development
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Workers need lots of RAM for Remotion + FFmpeg
    deploy:
      resources:
        limits:
          memory: 4G

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
