name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------
  # Lint + Typecheck + Test
  # -----------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test -- --run

      - name: Validate Prisma schema
        run: pnpm --filter @viralforge/db exec prisma validate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  # -----------------------------------------------------------------------------
  # Build (web + api + worker)
  # -----------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @viralforge/db db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy

      - name: Build API
        run: pnpm --filter @viralforge/api build

      - name: Build worker
        run: pnpm --filter @viralforge/worker build

  # -----------------------------------------------------------------------------
  # Docker build (smoke test that images can be built)
  # -----------------------------------------------------------------------------
  docker:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: viralforge-web:ci

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: viralforge-api:ci

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: viralforge-worker:ci

  # -----------------------------------------------------------------------------
  # Secrets scan — no .env, no API keys in git
  # -----------------------------------------------------------------------------
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$'; then
            echo "FAIL: env file committed to git"
            exit 1
          fi
          echo "OK: no env files committed"

      - name: Check for forbidden no-code automation platforms
        run: |
          if grep -r --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' --include='*.md' \
            -E 'make\.com|n8n\.io|zapier\.com' . \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist; then
            echo "FAIL: no-code automation platform referenced"
            exit 1
          fi
          echo "OK: no Make.com / n8n / Zapier references"
